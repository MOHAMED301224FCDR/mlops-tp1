name: MLOps Pipeline

on: [push]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model with MLflow tracking
        run: python src/train.py

      - name: Data Drift analysis
        run: python experiments/data_drift.py

      - name: Verify accuracy >= 0.8
        run: |
          python - <<'EOF'
          from sklearn.datasets import load_iris
          from sklearn.model_selection import train_test_split
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import accuracy_score

          iris = load_iris()
          X_train, X_test, y_train, y_test = train_test_split(
              iris.data, iris.target, test_size=0.2, random_state=42, stratify=iris.target
          )
          model = RandomForestClassifier(n_estimators=100, random_state=42)
          model.fit(X_train, y_train)
          acc = accuracy_score(y_test, model.predict(X_test))
          print("Accuracy :", acc)
          assert acc >= 0.8, "Accuracy trop basse, pipeline echoue !"
          print("Test OK - pipeline valide")
          EOF